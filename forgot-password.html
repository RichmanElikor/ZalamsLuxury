<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Zalams Luxury</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/navbar.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar scrolled" id="navbar">
    <div class="container">
      <div class="navbar__inner">
        <a href="/" class="navbar__logo">ZALAM<span>S</span></a>
        <ul class="navbar__links">
          <li><a href="/">Home</a></li>
          <li><a href="/shop">Shop</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="/faq">FAQ</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
        <div class="navbar__actions">
          <a href="/cart">Cart <span class="cart-count" id="cart-count">0</span></a>
        </div>
        <div class="navbar__hamburger" id="hamburger">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="navbar__mobile" id="mobile-menu">
    <a href="/">Home</a>
    <a href="/shop">Shop</a>
    <a href="/about">About</a>
    <a href="/faq">FAQ</a>
    <a href="/contact">Contact</a>
    <a href="/cart">Cart</a>
  </div>


  <!-- AUTH SECTION -->
  <section class="auth-section">
    <div class="auth-card">

      <div class="auth-card__header">
        <a href="/" class="auth-card__logo">ZALAM<span>S</span></a>
        <h1 class="auth-card__title">Forgot Password</h1>
        <p class="auth-card__subtitle">
          Enter your email and we'll send you a reset link
        </p>
      </div>

      <div class="auth-form" id="forgot-form">

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" id="forgot-email"
            placeholder="john@example.com" />
        </div>

        <p class="auth-error" id="forgot-error"></p>

        <button class="auth-submit" id="forgot-btn"
          onclick="handleForgotPassword()">
          Send Reset Link
        </button>

        <p class="auth-switch">
          Remember your password?
          <a href="/login">Log in here</a>
        </p>

      </div>

    </div>
  </section>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/shop.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
